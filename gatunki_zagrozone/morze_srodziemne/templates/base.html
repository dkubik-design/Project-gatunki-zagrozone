{% load static %}

<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gatunki Zagrożone - Morze Śródziemne</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>

    <nav class="navbar">
    <form action="/search/" method="GET" class="search-form">
        <input type="text" name="q" placeholder="Szukaj..." required>
        <button type="submit">Szukaj</button>
    </form>

    <div class="nav-logo">
        <a href="/">MARE NOSTRUM ANIMAL</a>
    </div>

    <div class="nav-links">
        {% if user.is_authenticated %}
            <a href="{% url 'add_species_url' %}" class="btn-add">➕ Dodaj gatunek</a>
            <a href="{% url 'profile_url' %}">Profil</a> <a href="/logout/">Wyloguj</a>
        {% else %}
            <a href="{% url 'login_url' %}">Zaloguj / Rejestracja</a>
        {% endif %}
    </div>
</nav>


    <main class="container">
        {% block content %}
        {% endblock %}
    </main>

    <footer class="footer">
        <p>&copy; 2026 Projekt: Gatunki zagrożone basenu Morza Śródziemnego</p>
    </footer>

</body>
</html>
