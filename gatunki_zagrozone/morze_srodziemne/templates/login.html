{% extends 'base.html' %}

{% block content %}
<div class="login-container">
    <h2>Logowanie</h2>
    <form method="POST">
        {% csrf_token %}
        {{ form.as_p }}  <button type="submit">Zaloguj się</button>
    </form>

    <hr> <p>Nie masz jeszcze konta? 
        <a href="{% url 'register_url' %}">Zarejestruj się tutaj</a>
    </p>



</div>
{% endblock %}
